<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rune Cipher Puzzle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h2>Rune Cipher Puzzle</h2>

  <!-- Instructions -->
  <p class="instructions">
    Instructions: Solve the jigsaw puzzle to reveal the cipher. Then scroll down and decode the message.
  </p>

  <!-- 1) Full runic message at the top -->
  <p class="runes-top">
    ᚨᛒᚾ &nbsp; ᛦᚡᚨᛊᚾᛦᚹ &nbsp; ᛒᛊᛎᛎ &nbsp; ᚴᚾ &nbsp; ᚨᚾ &nbsp; ᛒᚡᛢ &nbsp; ᚺᛏᚨ &nbsp; ᚾᛦᛎᚠ &nbsp; ᚾᛦᛟ &nbsp; ᛒᛊᛎᛎ &nbsp; ᚱᛢᛟᛁᚡᛊᛎ
  </p>

  <!-- 2) Embedded jigsaw puzzle (Jigidi) -->
  <iframe
    class="puzzle-embed"
    src="https://www.jigidi.com/s/ulgihf/?embed"
    title="Jigsaw puzzle"
    allow="fullscreen"
    allowfullscreen>
  </iframe>

  <!-- 3) Answer area: each runic word + input boxes on its own line -->
  <div id="answer-container"></div>

  <!-- Check / feedback controls -->
  <button id="checkButton" class="centered-btn">Check Answer</button>
  <p id="result"></p>

  <!-- Buttons shown only upon correct answer -->
  <button id="copyButton" class="centered-btn hidden">Copy Link</button>
  <button id="goButton" class="centered-btn hidden">Go to Link</button>

  <script src="puzzle.js"></script>
</body>
</html>
