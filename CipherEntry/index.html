<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rune Puzzle</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      max-width: 600px;
    }
    .runes-top {
      font-size: 1.2em;
      margin-bottom: 1em;
    }
    .puzzle-embed {
      width: 100%;
      height: 575px;
      margin-bottom: 2em;
    }
    .puzzle-line {
      margin: 8px 0; /* spacing between each word line */
      display: flex;
      align-items: center;
    }
    .runes-for-word {
      min-width: 110px; /* adjust as needed so runes don’t wrap onto next line */
      font-weight: bold;
      margin-right: 8px;
    }
    .answer-group {
      display: inline-block;
    }
    .answer-box {
      width: 2em;
      text-align: center;
      font-size: 1em;
      margin: 2px;
    }
    #result {
      font-weight: bold;
      margin-top: 1em;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <h2>Rune Puzzle</h2>

  <!-- 1) Full runic message at the top -->
  <p class="runes-top">
    ᚨᛒᚾ &nbsp; ᛦᚡᚨᛊᚾᛦᚹ &nbsp; ᛒᛊᛎᛎ &nbsp; ᚴᚾ &nbsp; ᚨᚾ &nbsp; ᛒᚡᛢ &nbsp; ᚺᛏᚨ &nbsp; ᚾᛦᛎᚠ &nbsp; ᚾᛦᛟ &nbsp; ᛒᛊᛎᛎ &nbsp; ᚱᛢᛟᛁᚡᛊᛎ
  </p>

  <!-- 2) Embedded Jigidi puzzle (iframe) -->
  <iframe
    class="puzzle-embed"
    src="https://www.jigidi.com/s/ulgihf/?embed"
    title="Jigsaw puzzle"
    frameborder="0"
    allow="fullscreen"
    allowfullscreen>
  </iframe>

  <!-- 3) Answer area: each runic word + input boxes on its own line -->
  <div id="answer-container"></div>

  <button id="checkButton">Check Answer</button>
  <p id="result"></p>

  <!-- Buttons shown only upon correct answer -->
  <button id="copyButton" class="hidden">Copy Link</button>
  <button id="goButton" class="hidden">Go to Link</button>

  <script src="puzzle.js"></script>
</body>
</html>
